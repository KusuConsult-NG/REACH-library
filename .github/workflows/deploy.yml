name: Deploy to GitHub Pages

on:
  push:
    # `claude/**` is here so the branch can be previewed before it is merged.
    # Drop it once this lands on main.
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A single in-flight deployment; queued runs supersede one another.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Project sites are served from /<repo>/, so the bundle, the service
          # worker scope and the manifest all need that prefix.
          REACH_BASE: /${{ github.event.repository.name }}/

      # Pages has no SPA rewrite: a deep link like /REACH-library/search would
      # 404 on first visit, before the service worker is installed. Serving the
      # app shell as the 404 page makes the router pick the route up instead.
      - run: cp dist/index.html dist/404.html

      # Jekyll would otherwise strip files and folders beginning with an
      # underscore out of the published site.
      - run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
